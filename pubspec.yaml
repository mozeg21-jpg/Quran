name: quran_app
description: "A luxury iOS-styled Holy Quran application built with Flutter."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # واجهات وأيقونات iOS
  cupertino_icons: ^1.0.8

  # إدارة الحالة
  provider: ^6.1.2

  # التخزين وقواعد البيانات المحلية
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # الصوتيات
  just_audio: ^0.9.40
  audio_session: ^0.1.21

  # الموقع وحساب مواقيت الصلاة والبوصلة
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  adhan_dart: ^2.0.0
  flutter_compass: ^0.8.0

  # الشبكة ومشاركة النصوص والتنسيق الزمني
  share_plus: ^10.0.2
  intl: ^0.20.3
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/
